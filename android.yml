name: RONI LIVE SCANNER PRO - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build RONI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Check Project ZIP
        run: |
          echo "Checking RONI project..."
          ls -lah
          test -f RONI_LIVE_SCANNER_ANDROID_FIXED.zip
          echo "Project ZIP found successfully"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          mkdir -p source
          unzip -o RONI_LIVE_SCANNER_ANDROID_FIXED.zip -d source
          echo "Project extracted"
          ls -lah source

      - name: Check Android Files
        run: |
          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts
          test -f source/app/src/main/AndroidManifest.xml
          echo "All required Android files found"

      - name: Build Debug APK
        run: |
          cd source
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RONI APK
        uses: actions/upload-artifact@v4
        with:
          name: RONI-LIVE-SCANNER-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
